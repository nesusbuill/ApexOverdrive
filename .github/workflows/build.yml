name: Build APEX OVERDRIVE
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Decode keystore
        if: ${{ secrets.APEX_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.APEX_KEYSTORE_BASE64 }}" | base64 -d > apex-release.jks
      - name: Compute signature hash
        if: ${{ secrets.APEX_KEYSTORE_BASE64 != '' }}
        run: |
          keytool -exportcert -keystore apex-release.jks -alias ${{ secrets.APEX_KEY_ALIAS }} -storepass ${{ secrets.APEX_KEYSTORE_PASSWORD }} -file cert.der
          SIG_HASH=$(openssl dgst -sha256 -hex cert.der | awk '{print $2}' | head -c 16)
          echo "SIG_HASH=$SIG_HASH" >> $GITHUB_ENV
      - name: Inject hash into native
        if: ${{ env.SIG_HASH != '' }}
        run: sed -i "s|#define APEX_SIG_HASH \".*\"|#define APEX_SIG_HASH \"${SIG_HASH}\"|" app/src/main/cpp/native-lib.cpp
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.2' }
      - name: Build Release
        env:
          APEX_KEYSTORE_PATH: apex-release.jks
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ApexOverdrive-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
