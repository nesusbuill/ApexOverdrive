name: Build APEX OVERDRIVE
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
        
      - name: Setup NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          
      - name: Auto Generate Keystore
        run: |
          keytool -genkey -v -keystore apex-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias apex -storepass "Apex123456" -keypass "Apex123456" -dname "CN=Apex"
          
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.2' }
        
      - name: Build Release
        run: gradle assembleRelease --stacktrace
        
      - uses: actions/upload-artifact@v4
        with:
          name: ApexOverdrive-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
