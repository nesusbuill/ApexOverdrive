plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.apex.overdrive'
    compileSdk 34
    defaultConfig {
        applicationId "com.apex.overdrive"
        minSdk 26; targetSdk 34
        versionCode 7; versionName "7.0.0"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake {
                cppFlags '-O2 -fvisibility=hidden'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    signingConfigs {
        release {
            if (file("../apex-release.jks").exists()) {
                storeFile file("../apex-release.jks")
                storePassword "Apex123456"
                keyAlias "apex"
                keyPassword "Apex123456"
            }
        }
    }
    buildTypes {
        debug { minifyEnabled false; debuggable true }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { 
        compose true 
        buildConfig = true 
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def suffix = (variant.buildType.name == "debug") ? "" : "-${variant.buildType.name}"
            outputFileName = "ApexOverdrive-v${variant.versionName}${suffix}.apk"
        }
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.compose.material:material-icons-extended'
}
